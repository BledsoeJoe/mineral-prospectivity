# Full stack:
#
#   docker compose up --build          # pipeline (synth) + postgres + api + dagster + web
#   MPM_PROFILE=us-cu docker compose up --build   # real-data US copper cube
#
#   web (nginx + React app)  -> http://127.0.0.1:8080
#   dagster UI               -> http://127.0.0.1:8080/dagster/
#
# Only one port is published, and only on loopback: put a host reverse proxy
# (TLS + auth) in front of localhost:8080 and everything, Dagster included,
# rides behind it.
#
# Services:
#   postgres        the catalog: data sources (incl. user-added), run index,
#                   per-cell scores -- and Dagster's own run storage.
#   pipeline        one-shot CLI run of the ${MPM_PROFILE} profile; publishes
#                   to the shared ./data volume and exits. Safe to re-run:
#                   stage manifests make an unchanged pipeline a no-op.
#   dagster         the orchestrator UI (internal; served at /dagster/).
#   dagster-daemon  schedules and sensors.
#   api             read-only FastAPI over published artifacts + source management.
#   web             the frontend; nginx proxies /api and /dagster/.
#
# Other invocations run through the same images, e.g.:
#   docker compose run --rm pipeline python -m mpm etl run --profile us-cu --data-root /data
#   docker compose run --rm pipeline python -m mpm etl status --data-root /data
#   docker compose run --rm pipeline pytest -q
#   docker compose exec postgres psql -U mpm mpm -c 'select run_id, profile from catalog.runs'

x-python-env: &python-env
  MPM_DATA_ROOT: /data
  DATABASE_URL: postgresql://mpm:${POSTGRES_PASSWORD:-mpm}@postgres:5432/mpm
  # Published runs only; unset keeps them on ./data. Set to an s3:// prefix to
  # move the publish contract into object storage. Raw downloads and stage
  # manifests stay on the volume either way.
  MPM_RUNS_ROOT: ${MPM_RUNS_ROOT:-}
  # Both spellings ride through; mpm.storage prefers AWS_ENDPOINT_URL.
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpm}
      POSTGRES_DB: mpm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpm -d mpm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: python -m mpm etl run --profile ${MPM_PROFILE:-synth} --data-root /data
    environment: *python-env
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The Dagster UI is not published on any host port: the web service's nginx
  # proxies it at /dagster/, so it sits behind whatever domain routing and
  # auth fronts the app itself. --path-prefix makes the webserver generate
  # /dagster/-rooted URLs natively.
  dagster:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: >
      bash -c "mkdir -p $$DAGSTER_HOME
      && cp docker/dagster.yaml $$DAGSTER_HOME/dagster.yaml
      && dagster-webserver -h 0.0.0.0 -p 3000 --path-prefix /dagster
      -f src/mpm/orchestration/defs.py"
    environment: &dagster-env
      <<: *python-env
      DAGSTER_HOME: /data/dagster_home
      DAGSTER_PG_URL: postgresql://mpm:${POSTGRES_PASSWORD:-mpm}@postgres:5432/mpm
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Runs schedules and sensors (dagster dev bundled this; split out, each
  # process does one job and restarts independently).
  dagster-daemon:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: >
      bash -c "mkdir -p $$DAGSTER_HOME
      && cp docker/dagster.yaml $$DAGSTER_HOME/dagster.yaml
      && dagster-daemon run -f src/mpm/orchestration/defs.py"
    environment: *dagster-env
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: uvicorn mpm.api:app --host 0.0.0.0 --port 8000
    environment:
      <<: *python-env
      # Lets POST /api/materialize launch runs via Dagster's GraphQL API.
      MPM_DAGSTER_URL: http://dagster:3000/dagster
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # The single published port, bound to loopback by default: a host-level
  # reverse proxy (with its own TLS/auth) forwards to localhost:8080, and
  # nothing in this stack is reachable from the network directly. Set
  # MPM_BIND=0.0.0.0 only if you genuinely want the port open.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_CARTO_KEY: ${MAPS_API_KEY:-}
    ports:
      - "${MPM_BIND:-127.0.0.1}:${MPM_PORT:-8080}:80"
    depends_on:
      - api
      - dagster
    restart: unless-stopped

volumes:
  pgdata:
