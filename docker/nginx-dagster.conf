# Dagster UI behind this app's origin. Mounted into /etc/nginx/mpm.d/ only
# where a dagster service exists; nginx resolves upstream hosts at startup, so
# loading this on a node without one keeps nginx from starting at all.
#
# The webserver runs with --path-prefix /dagster, so it generates
# /dagster/-rooted URLs itself and the URI passes through unchanged. No host
# port is published for it; this is the only way in, which means it inherits
# whatever TLS/auth the front proxy puts on this app.
location = /dagster { return 302 /dagster/; }
location /dagster/ {
    proxy_pass http://dagster:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
}
