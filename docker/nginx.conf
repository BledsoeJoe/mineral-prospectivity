# Dagster's UI uses websockets for live run/log updates; only upgrade the
# connection when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # cells.json.gz arrives pre-gzipped from the api; pass it through untouched.
        proxy_http_version 1.1;
    }

    # The Dagster webserver runs with --path-prefix /dagster, so it generates
    # /dagster/-rooted URLs itself and the URI passes through unchanged. No
    # host port is published for it; this is the only way in, which means it
    # inherits whatever TLS/auth the front proxy puts on this app.
    location = /dagster { return 302 /dagster/; }
    location /dagster/ {
        proxy_pass http://dagster:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
