# Dagster's UI uses websockets for live run/log updates; only upgrade the
# connection when the client asks for it. Lives here because map is
# http-level; inert unless nginx-dagster.conf is mounted.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # cells.json.gz arrives pre-gzipped from the api; pass it through untouched.
        proxy_http_version 1.1;
    }

    # Node-specific locations, mounted per deployment (nginx-dagster.conf on
    # nodes that run Dagster). A glob matching nothing is not an error.
    include /etc/nginx/mpm.d/*.conf;

    location / {
        try_files $uri /index.html;
    }
}
