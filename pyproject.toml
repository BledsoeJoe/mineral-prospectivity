[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpm"
version = "0.1.0"
description = "Positive-unlabeled mineral prospectivity mapping with spatial cross-validation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "h3>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "psycopg[binary]>=3.1"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8", "dagster-postgres>=0.24"]
geo = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0"]

[project.scripts]
mpm = "mpm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local exploration only, kept out of the package and the container image.
[dependency-groups]
notebooks = [
    "ipykernel>=7.3.0",
    "polars>=1.43.2",
    "deltalake>=1.6.3",
    "python-dotenv>=1.0",
]
